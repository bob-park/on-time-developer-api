plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.github.node-gradle.node' version '7.1.0'
}

group = 'com.malgn'
version = '0.0.0-rc1-20260724'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

node {
    download = true
    version = '24.12.0'
}

ext {
    malgnStarterVersion = "3.1.2-rc1-20260812"

    springModulithVersion='2.1.0'
    springCloudVersion = '2025.1.2'
    springCloudAwsVersion = "4.1.0"

    queryDslVersion = "7.4.0"
    lombokVersion = "1.18.46"
}

repositories {
    mavenCentral()

    maven {
        name = "GitHubPackages"
        url = uri("https://maven.pkg.github.com/malgn/dependency-repository")
        credentials {
            username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_GRADLE_USERNAME")
            password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_GRADLE_ACCESS_TOKEN")
        }
    }
}

dependencies {
    // malgn spring boot starter
    implementation "com.malgn:malgn-spring-boot-starter:${malgnStarterVersion}"

    // spring boot
    implementation 'org.springframework.boot:spring-boot-data-commons' // spring-boot-starter-data-x 가 있는 경우 제거
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // spring modulith
    implementation 'org.springframework.modulith:spring-modulith-starter-core'
    implementation 'org.springframework.modulith:spring-modulith-starter-jpa'
    implementation 'org.springframework.modulith:spring-modulith-events-kafka'
    testImplementation 'org.springframework.modulith:spring-modulith-starter-test'

    // kafka
    implementation 'org.springframework.boot:spring-boot-starter-kafka'

    // spring security
    implementation 'org.springframework.boot:spring-boot-starter-security'
    testImplementation 'org.springframework.security:spring-security-test'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    // spring cloud
    implementation 'org.springframework.cloud:spring-cloud-starter-consul-discovery'
    implementation 'org.springframework.cloud:spring-cloud-starter-consul-config'

    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'

    // jdbc
    implementation 'org.postgresql:postgresql:42.7.3'

    // p6spy
    implementation 'com.github.gavlyukovskiy:p6spy-spring-boot-starter:2.0.0'

    // lombok
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    // querydsl
    implementation("io.github.openfeign.querydsl:querydsl-jpa:${queryDslVersion}")
    annotationProcessor("io.github.openfeign.querydsl:querydsl-apt:${queryDslVersion}:jakarta")
    testAnnotationProcessor("io.github.openfeign.querydsl:querydsl-apt:${queryDslVersion}:jakarta")

    // aws sdk
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-s3'

    // prometheus
    implementation 'io.micrometer:micrometer-registry-prometheus'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        mavenBom "io.awspring.cloud:spring-cloud-aws-dependencies:${springCloudAwsVersion}"
        mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

// bundle api docs
tasks.register('bundleOpenApi', com.github.gradle.node.npm.task.NpxTask) {
    group = "documentation"

    command = '@redocly/cli'

    def specFilename = "openapi3.${rootProject.name}";

    def inputExtension = "yml"
    def outputExtension = "json"

    def outputFile = layout.buildDirectory.file("openapi/${specFilename}.${outputExtension}")

    args = ['bundle', "docs/apis/${specFilename}.${inputExtension}", '-o', outputFile.get().asFile.path]

    inputs.dir('docs/apis')
    outputs.file(outputFile)
}

processResources {
    dependsOn bundleOpenApi

    from(layout.buildDirectory.dir('openapi')) {
        into 'static/v1/docs/apis'
    }
}
