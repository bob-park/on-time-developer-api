## server
server:
  port: 8080
  servlet:
    context-path: /api
  tomcat:
    mbeanregistry:
      enabled: on

## actuator
management:
  info:
    java:
      enabled: on
    env:
      enabled: on
    os:
      enabled: on
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    tags:
      application: ${spring.application.name}

## spring
spring:
  application:
    name: template
  main:
    banner-mode: log
    allow-bean-definition-overriding: on
  threads:
    virtual:
      enabled: on
  config:
    import: "optional:consul:"
  data:
    redis:
      repositories:
        enabled: off
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${database_host:localhost:5432}/${database_name:keyflow}
    username: ${database_username}
    password: ${database_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
        discriminator:
          ignore_explicit_for_joined: on
  kafka:
    bootstrap-servers: ${kafka_bootstrap_servers:localhost:9092}
    consumer:
      group-id: ${kafka_consumer_group_id:template}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  modulith:
    events:
      republish-outstanding-events-on-restart: on
      completion-mode: delete
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${keyflow_auth_issuer_host}
      client:
        provider:
          keyflow-auth:
            issuer-uri: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}
        registration:
          keyflow-auth:
            authorization-grant-type: client_credentials
            client-name: ${keyflow_auth_client_name}
            client-id: ${keyflow_auth_client_id}
            client-secret: ${keyflow_auth_client_client_secret}
            scope:
              - openid
              - profile
              - users:read:summary
  cloud:
    refresh:
      enabled: off
    consul:
      host: ${consul_host:localhost}
      port: ${consul_port:8500}
      config:
        format: yaml
      discovery:
        instance-id: ${spring.application.name}:${random.value}
        health-check-path: /api/actuator/health
        health-check-interval: 15s
        health-check-critical-timeout: 30m
        metadata:
          metrics_path: /api/actuator/prometheus
          metrics_port: ${server.port}
        tags:
          - metrics
    openfeign:
      client:
        config:
          default:
            logger-level: basic
    aws:
      credentials:
        access-key: ${aws_credentials_access_key}
        secret-key: ${aws_credentials_secret_key}
      s3:
        region: ${aws_s3_region:ap-northeast-2}
        endpoint: ${aws_s3_endpoint:https://s3.ap-northeast-2.amazonaws.com}


## malgn
malgn:
  enabled: on
  api:
    version:
      enabled: on
  auth:
    user:
      enabled: on
      host: ${auth-user-host:http://localhost:8080}
  redis:
    enabled: on
    host: ${redis_host:redis://localhost:6379}
  notification:
    enabled: off

## storage
storage:
  aws:
    type: ${storage_aws_type:s3_presigned_url}
    s3:
      bucket: ${storage_aws_s3_bucket}

## logging
logging:
  charset:
    console: UTF-8
    file: UTF-8
  file:
    name: ${logs_path:/root/app/logs}/${spring.application.name}.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} ${LOG_LEVEL_PATTERN:%-5p} ${PID} --- [%15.15t] %-40.40logger{39} :%06L : %m%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} ${LOG_LEVEL_PATTERN:%-5p} ${PID} --- [%15.15t] %-40.40logger{39} :%06L : %m%n"
  logback:
    rollingpolicy:
      file-name-pattern: "${logs_path}/%d{yyyy-MM-dd}/${spring.application.name}.%d{yyyy-MM-dd}.%i.log"
      max-file-size: 10MB
      max-history: ${log_max_history:10}
  level:
    root: info
    web: ${logs_level:info}
    com.malgn: ${logs_level:info}

