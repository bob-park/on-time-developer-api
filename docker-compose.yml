name: cms-api

services:
  api:
    image: ghcr.io/malgn/template-api:${VERSION}
    mem_limit: 1g
    build:
      dockerfile: ./Dockerfile
      x-bake:
        platforms:
          - linux/amd64
          - linux/arm64
        tags:
          - ghcr.io/malgn/template-api:${VERSION}
          - ghcr.io/malgn/template-api:latest
