name: on-time-developer-api

services:
  api:
    image: ghcr.io/bob-park/on-time-developer-api:${VERSION}
    mem_limit: 1g
    build:
      dockerfile: ./Dockerfile
      x-bake:
        platforms:
          - linux/amd64
          - linux/arm64
        tags:
          - ghcr.io/bob-park/on-time-developer-api:${VERSION}
          - ghcr.io/bob-park/on-time-developer-api:latest
