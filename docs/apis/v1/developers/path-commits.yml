post:
  operationId: registerCommitV1
  tags:
    - Commits V1
  summary: 커밋 등록
  description: >
    신규 커밋 정보가 시스템에 등록된다.
  security:
    - keyflow-auth:
        - openid
        - profile
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: './schema-commit-register-request.yml'
  responses:
    "200":
      description: "Successful Response"
      content:
        application/json:
          schema:
            $ref: "./schema-commit-response.yml"
    "400":
      description: "Bad Request"
      content:
        application/problem+json:
          schema:
            $ref: "../../schema-error-response.yml"
          example:
            type: "about:blank"
            title: "Bad Request"
            status: 400
            detail: "Invalid request content."
            instance: "/api/v1/developers/commits"
            code: BAD_REQUEST
            timestamp: "2026-08-14T10:00:00"
            exception: MethodArgumentNotValidException
    "401":
      description: "Unauthorized"
      content:
        application/problem+json:
          schema:
            $ref: "../../schema-error-response.yml"
          example:
            type: "about:blank"
            title: "Unauthorized"
            status: 401
            detail: "Full authentication is required to access this resource"
            instance: "/api/v1/developers/commits"
            code: UNAUTHORIZED
            timestamp: "2026-08-14T10:00:00"
            exception: InsufficientAuthenticationException
get:
  operationId: listCommitsV1
  tags:
    - Commits V1
  summary: 커밋 목록 조회
  description: >
    검색 조건에 맞는 커밋 목록을 페이징하여 조회한다.
  security:
    - keyflow-auth:
        - openid
        - profile
  parameters:
    - name: repo
      in: query
      required: false
      description: 저장소 이름
      schema:
        type: string
    - name: branch
      in: query
      required: false
      description: 브랜치 이름
      schema:
        type: string
    - name: author
      in: query
      required: false
      description: 커밋 작성자
      schema:
        type: string
    - name: commitMessage
      in: query
      required: false
      description: 커밋 메시지 (부분 일치)
      schema:
        type: string
    - name: createdDateFrom
      in: query
      required: false
      description: 등록일 검색 시작 (이상)
      schema:
        type: string
        format: date-time
    - name: createdDateTo
      in: query
      required: false
      description: 등록일 검색 종료 (이하)
      schema:
        type: string
        format: date-time
    - name: createdBy
      in: query
      required: false
      description: 등록자
      schema:
        type: string
    - name: page
      in: query
      required: false
      description: 페이지 번호 (zero-based)
      schema:
        type: number
        default: 0
    - name: size
      in: query
      required: false
      description: 페이지당 표시 항목 수
      schema:
        type: number
        default: 25
    - name: sort
      in: query
      required: false
      description: "정렬 조건 (`{field},{asc|desc}`)"
      schema:
        type: string
        default: "createdDate,desc"
  responses:
    "200":
      description: "Successful Response"
      content:
        application/json:
          schema:
            type: object
            description: Spring Data Page 응답
            properties:
              page:
                $ref: "../../schema-paged-model.yml"
              content:
                type: array
                items:
                  $ref: "./schema-commit-response.yml"
    "401":
      description: "Unauthorized"
      content:
        application/problem+json:
          schema:
            $ref: "../../schema-error-response.yml"
          example:
            type: "about:blank"
            title: "Unauthorized"
            status: 401
            detail: "Full authentication is required to access this resource"
            instance: "/api/v1/developers/commits"
            code: UNAUTHORIZED
            timestamp: "2026-08-14T10:00:00"
            exception: InsufficientAuthenticationException
