type: object
title: CommitRegisterRequestV1
required:
  - commitId
  - repo
  - branch
  - author
  - userUniqueId
  - commitMessage
  - commitDate
properties:
  commitId:
    type: string
    description: 커밋 해시
  repo:
    type: string
    description: 저장소 이름
  branch:
    type: string
    description: 브랜치 이름
  author:
    type: string
    description: 커밋 작성자
  userUniqueId:
    type: integer
    format: int64
    description: 사용자 고유 아이디
  commitMessage:
    type: string
    description: 커밋 메시지
  commitDate:
    type: string
    format: date-time
    description: 커밋 일시
